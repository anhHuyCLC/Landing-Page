<!doctype html>
<html class="dark scroll-smooth" lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AURORA PC - Cấu hình máy tính gaming cao cấp theo yêu cầu. Build Beyond Limits." />

  <title>AURORA PC - Build Beyond Limits</title>

  <!-- Preconnect Railway API matching CORS fetch requests -->
  <link rel="preconnect" href="https://belandingpage-production.up.railway.app" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://belandingpage-production.up.railway.app" />

  <!-- DNS Prefetch & Preconnect Google Fonts -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload Hero LCP Image in Next-Gen WebP format -->
  <link
    rel="preload"
    as="image"
    href="/images/exploded-pc.webp"
    type="image/webp"
    fetchpriority="high"
  />

  <!-- Load Google Fonts asynchronously with essential weights only (65% payload reduction) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Hanken+Grotesk:wght@400;600;700&family=Geist:wght@400;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Hanken+Grotesk:wght@400;600;700&family=Geist:wght@400;600&display=swap" />
  </noscript>
</head>

<body class="bg-[#050505] text-[#F5F5F5] antialiased selection:bg-[#D4AF37] selection:text-black">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
